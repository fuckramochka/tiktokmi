name: build apk

# Manual only: the official apk is proprietary and cannot live in this
# repository, so whoever starts the build points at it. Give a direct link
# to a universal TikTok apk (type APK, not BUNDLE, arm64-v8a, nodpi).
# The finished mod is uploaded as an artifact; the official apk never is.
on:
  workflow_dispatch:
    inputs:
      apk_url:
        description: "Direct link to a universal TikTok apk"
        required: false
        default: "https://github.com/fuckramochka/tiktokmi/releases/download/official-47.2.41/com.zhiliaoapp.musically_47.2.41-2024702410_minAPI23.arm64-v8a.nodpi.apk"
      accent:
        description: "Baked accent RRGGBB (empty keeps TikTok red)"
        required: false
        default: ""
      create_release:
        description: "Create GitHub Release after build (true/false)"
        required: false
        default: "true"
      tag_name:
        description: "Release tag name (leave empty to use VERSION, e.g. 4.2)"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/cache@v4
        with:
          path: tools
          key: toolchain-${{ hashFiles('tiktokmi/toolchain.py') }}

      - name: validate inputs
        run: |
          if [ -n "${{ inputs.accent }}" ]; then
            echo "${{ inputs.accent }}" | grep -Eq '^[0-9a-fA-F]{6}$' \
              || { echo "accent must be six hex digits, like 8DD1B0"; exit 1; }
          fi

      - name: download the official apk
        run: |
          APK_URL="${{ inputs.apk_url }}"
          if [ -z "$APK_URL" ]; then
            APK_URL="https://github.com/fuckramochka/tiktokmi/releases/download/official-47.2.41/com.zhiliaoapp.musically_47.2.41-2024702410_minAPI23.arm64-v8a.nodpi.apk"
          fi
          curl -fSL --retry 3 -A "Mozilla/5.0" -o official.apk "$APK_URL"
          ls -la official.apk

      - name: install Pillow (icon thumbnails)
        run: pip install pillow

      - name: build
        run: |
          ACCENT=""
          if [ -n "${{ inputs.accent }}" ]; then ACCENT="--accent ${{ inputs.accent }}"; fi
          python3 -m tiktokmi official.apk $ACCENT

      - name: upload the mod artifact
        uses: actions/upload-artifact@v4
        with:
          name: tiktokmi.apk
          path: build/tiktokmi.apk

      - name: create github release
        if: ${{ github.event.inputs.create_release != 'false' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION=$(cat VERSION | tr -d '[:space:]')
          TAG="${{ inputs.tag_name }}"
          if [ -z "$TAG" ]; then
            TAG="$VERSION"
          fi
          TITLE="TikTok Mi v$TAG"

          python3 -c "import json; data=json.load(open('version.json')); print(data.get('notes_uk') or data.get('notes') or data.get('notes_ru') or '')" > release_notes.txt
          if [ ! -s release_notes.txt ]; then
            echo "TikTok Mi v$TAG update" > release_notes.txt
          fi

          echo "Publishing release $TAG..."
          gh release create "$TAG" build/tiktokmi.apk \
            --title "$TITLE" \
            -F release_notes.txt \
            --latest || gh release upload "$TAG" build/tiktokmi.apk --clobber
