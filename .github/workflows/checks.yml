name: checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: actions/cache@v4
        with:
          path: tools
          key: toolchain-${{ hashFiles('tiktokmi/toolchain.py') }}

      - name: unit tests
        run: python -m unittest discover tests

      - name: compile the mod (javac + D8, as the build does)
        run: python -c "from tiktokmi.toolchain import Toolchain; Toolchain('tools').compile_dex('inject/java', 'work/ci', 23, 'inject/stubs')"
